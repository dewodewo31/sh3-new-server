# Arsitektur kombinasi:
#   - Web/app : nginx (host) -> php-fpm 8.3 (host)
#   - Infra   : MySQL + Redis via Docker Compose (bind loopback saja)
#
# Queue worker, Reverb, dan scheduler tetap dikelola supervisor di host
# dan terhubung ke service Docker ini lewat 127.0.0.1.

services:
  mysql:
    image: mysql:8.0
    container_name: sh3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: database_pass
      MYSQL_DATABASE: db_sh3server
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdatabase_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sh3-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
